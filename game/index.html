<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dapur Kilat — Warung Rush</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <h1>Dapur Kilat <span>— Warung Rush</span></h1>
    <p id="tagline">Sajikan pesanan secepat kilat sebelum pelanggan kabur!</p>
  </header>
  <div id="stage">
    <canvas id="game" width="1280" height="720"></canvas>
    <div id="pause" class="overlay hidden">
      <div class="panel">
        <h2>JEDA</h2>
        <p>Tekan <b>P</b> untuk lanjut masak.</p>
      </div>
    </div>
    <div id="gameover" class="overlay hidden">
      <div class="panel">
        <h2>Waktu Habis!</h2>
        <p id="final-score"></p>
        <p id="final-stars"></p>
        <p id="final-detail"></p>
        <button id="restart-btn" type="button">Main Lagi (R)</button>
      </div>
    </div>
  </div>
  <footer id="help">
    <span><b>WASD / Panah</b> gerak</span>
    <span><b>E / Spasi</b> ambil &amp; olah</span>
    <span><b>Klik</b> jalan ke stasiun</span>
    <span><b>P</b> jeda</span>
    <span><b>M</b> suara</span>
    <span><b>R</b> ulang</span>
  </footer>
</div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
